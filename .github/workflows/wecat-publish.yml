name: WeCat publish verified candidate
on:
  workflow_dispatch:
    inputs:
      commit:
        description: 'Full commit SHA already reviewed on master'
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: wecat-candidate-publish
  cancel-in-progress: false
jobs:
  validate:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit }}
          fetch-depth: 0
      - name: Require a reviewed master commit
        env:
          CANDIDATE: ${{ inputs.commit }}
        run: |
          [[ "$CANDIDATE" =~ ^[0-9a-f]{40}$ ]]
          git fetch origin master
          test "$(git rev-parse HEAD)" = "$CANDIDATE"
          git merge-base --is-ancestor HEAD origin/master
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Install pinned dependencies
        run: |
          cp wecat/locks/application.package-lock.json package-lock.json
          cp wecat/locks/tests.package-lock.json tests/package-lock.json
          npm ci --no-audit --no-fund
          npm --prefix tests ci --no-audit --no-fund
          npm --prefix wecat ci --ignore-scripts --no-audit --no-fund
          (cd wecat && ./node_modules/.bin/playwright install --with-deps chromium)
      - name: Re-run complete local gate
        run: |
          node wecat/check.mjs
          node wecat/verify-receipt.mjs
          cp wecat/.reports/receipt.json receipt.json
          docker save "wecat-9router:candidate-$(git rev-parse HEAD)" | gzip -1 > image.tar.gz
          sha256sum image.tar.gz > image.tar.gz.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: verified-image
          path: |
            image.tar.gz
            image.tar.gz.sha256
            receipt.json
          retention-days: 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: publication-validation
          path: wecat/.reports/
          retention-days: 14
  publish:
    needs: validate
    environment: wecat-release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ inputs.commit }}
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - uses: actions/download-artifact@v4
        with:
          name: verified-image
      - name: Verify the exact tested image before publication
        run: |
          sha256sum -c image.tar.gz.sha256
          gzip -dc image.tar.gz | docker load
          node wecat/verify-receipt.mjs receipt.json
      - name: Publish immutable commit tag only
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ACTOR: ${{ github.actor }}
          REPOSITORY: ${{ github.repository }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$ACTOR" --password-stdin
          image="ghcr.io/${REPOSITORY,,}:sha-$(git rev-parse HEAD)"
          docker tag "wecat-9router:candidate-$(git rev-parse HEAD)" "$image"
          docker push "$image"
          printf 'Candidate image: `%s`\n\nNo production deployment was performed.\n' "$image" >> "$GITHUB_STEP_SUMMARY"
